spring.application.name=buildlogai

spring.profiles.active=dev

spring.config.import=optional:file:.env[.properties]

openai.api.key=${OPENAI_API_KEY}
google.gemini.api.key=${GOOGLE_GEMINI_API_KEY}
google.gemini.project.id=${GOOGLE_GEMINI_PROJECT_ID}
google.gemini.location=${GOOGLE_GEMINI_LOCATION}

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

server.address=0.0.0.0
server.port=8080

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=smtp.gmail.com
# spring.mail.port=587

spring.mail.port=465
spring.mail.properties.mail.smtp.ssl.enable=true


spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
logging.level.com.sun.mail=DEBUG



